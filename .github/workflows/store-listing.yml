name: Store listing

# Chỉ chạy khi bấm "Run workflow". Đưa nội dung trang store (mô tả, ảnh chụp màn hình,
# icon, ảnh nổi bật) trong fastlane/metadata và store/ lên Google Play và App Store Connect.
# Không tải bản build và không gửi bản nào đi duyệt. Khi app chưa phát hành, nội dung chỉ
# nằm ở trang store chưa công khai. Khi app đã lên store, Google và Apple duyệt nội dung
# mới như khi sửa tay trong Console.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Nền tảng
        type: choice
        options: [both, android, ios]
        default: both

concurrency:
  group: store-listing
  cancel-in-progress: false

jobs:
  android:
    name: Google Play
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gom ảnh vào thư mục metadata
        run: |
          d=fastlane/metadata/android/vi-VN/images
          mkdir -p $d/phoneScreenshots
          cp store/play/icon-512.png $d/icon.png
          cp store/play/feature-graphic-1024x500.png $d/featureGraphic.png
          cp store/screenshots/android/*.png $d/phoneScreenshots/
      - name: Cài fastlane
        run: sudo gem install fastlane --no-document
      - name: Tải nội dung lên Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: fastlane android play_listing

  ios:
    name: App Store
    if: inputs.platform != 'android'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gom ảnh vào thư mục screenshots
        env:
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
        run: |
          mkdir -p fastlane/screenshots/vi
          cp store/screenshots/iphone/*.png fastlane/screenshots/vi/
          # Số điện thoại liên hệ cho người duyệt của Apple, không để trong repo.
          if [ -n "$APP_REVIEW_PHONE" ]; then
            echo "$APP_REVIEW_PHONE" > fastlane/metadata/ios/review_information/phone_number.txt
          fi
      - name: Chuẩn bị khóa App Store Connect API
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          jq -n --arg id "$ASC_KEY_ID" --arg issuer "$ASC_ISSUER_ID" --rawfile key "$RUNNER_TEMP/AuthKey.p8" \
            '{key_id: $id, issuer_id: $issuer, key: $key, in_house: false}' > "$RUNNER_TEMP/asc.json"
      - name: Cài fastlane
        run: brew install fastlane
      - name: Tải nội dung lên App Store Connect
        run: |
          # Phiên bản đang soạn trên App Store Connect, lấy theo pubspec.yaml.
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          fastlane run upload_to_app_store \
            api_key_path:"$RUNNER_TEMP/asc.json" \
            app_identifier:com.toanquantic.gplx \
            app_version:"$version" \
            metadata_path:fastlane/metadata/ios \
            screenshots_path:fastlane/screenshots \
            overwrite_screenshots:true \
            skip_binary_upload:true \
            submit_for_review:false \
            run_precheck_before_submit:false \
            force:true

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_pro:
        description: Mở sẵn Pro trong APK để test màn hình (không dùng để phát hành)
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Kiểm tra mã và chạy test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android (APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Có secret ANDROID_KEYSTORE_BASE64 thì ký bằng khóa phát hành và build thêm file AAB để
      # đưa lên Google Play. Không có (ví dụ PR từ fork) thì ký bằng khóa debug, chỉ cài thử được.
      - name: Giải mã khóa ký Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      # Chạy tay với force_pro: APK mở sẵn Pro, không qua cửa hàng, và không build AAB để
      # bản này không lọt lên Google Play.
      - run: flutter build apk --release ${{ inputs.force_pro && '--dart-define=FORCE_PRO=true' || '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.force_pro && 'on-thi-gplx-android-apk-pro-test' || 'on-thi-gplx-android-apk' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - if: env.ANDROID_KEYSTORE_PATH != '' && !inputs.force_pro
        run: flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - if: env.ANDROID_KEYSTORE_PATH != '' && !inputs.force_pro
        uses: actions/upload-artifact@v4
        with:
          name: on-thi-gplx-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios:
    name: Build iOS (chưa ký)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Chưa có chứng chỉ Apple nên build không ký, chỉ để chắc chắn bản iOS biên dịch được.
      - run: flutter build ios --release --no-codesign
      # Bản cho iOS Simulator: tải về, giải nén và kéo vào Simulator trên Mac để chạy thử.
      - run: flutter build ios --simulator --debug
      - run: cd build/ios/iphonesimulator && zip -qr ../../../on-thi-gplx-simulator.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: on-thi-gplx-ios-simulator
          path: on-thi-gplx-simulator.zip
          retention-days: 14
